<ion-header>
  <ion-toolbar>
    <ion-title>GAM</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main id="container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Bienvenido, {{ auth.user()?.nombre }}</ion-card-title>
        <ion-card-subtitle>
          {{ auth.isShared() ? 'Sesión operativa compartida' : 'Sesión personal' }}
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>El acceso y los permisos se verifican en el servidor en cada operación.</p>
        @if (auth.isAdmin()) {
          <ion-button routerLink="/administracion" expand="block">Administración</ion-button>
        }
        <ion-button color="medium" fill="outline" expand="block" (click)="auth.logout()">
          Cerrar sesión
        </ion-button>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
