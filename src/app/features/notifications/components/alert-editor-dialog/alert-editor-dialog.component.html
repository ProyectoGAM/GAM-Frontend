<dialog #dialog class="alert-dialog" [attr.aria-label]="'Editar alerta: ' + alertName()" (cancel)="requestDismiss($event)">
  <header class="dialog-heading">
    <h2 #heading tabindex="-1" autofocus>Editar alerta</h2>
    <button type="button" class="close" aria-label="Cerrar edición" [disabled]="saving()" (click)="requestDismiss()">
      <ion-icon name="close-outline" aria-hidden="true" />
    </button>
  </header>
  <div class="alert-context">
    <h3>{{ alertName() }}</h3>
    <p class="alert-scope"><ion-icon [name]="fleet() ? 'car-outline' : 'business-outline'" aria-hidden="true" /> {{ scope() }}</p>
    @if (fleet()) { <p>Aplica a toda la flota.</p> }
  </div>
  <ng-content />
</dialog>
