<div class="unit-context">
  <label for="admin-unit-select">UNIDAD PRODUCTIVA</label>
  <div class="unit-select-wrap">
    <ion-icon name="business-outline" aria-hidden="true" />
    <select id="admin-unit-select" (change)="selectUnit($event)"
      [disabled]="context.state() !== 'ready'" aria-label="Unidad productiva seleccionada">
      @if (isAdmin()) { <option value="" [selected]="context.selectedId() === null">Todas las UP</option> }
      @for (unit of context.units(); track unit.id) { <option [value]="unit.id" [selected]="context.selectedId() === unit.id">{{ unit.name }}</option> }
    </select>
    <ion-icon name="chevron-down-outline" aria-hidden="true" />
  </div>
  @if (context.state() === 'loading') {
    <small>Cargando unidades…</small>
  } @else if (context.state() === 'error') {
    <button class="unit-retry" type="button" (click)="context.load()">Reintentar carga de UP</button>
  } @else {
    <small>{{ context.selectedUnit() ? 'Vista de una unidad' : 'Vista consolidada' }}</small>
  }
</div>
