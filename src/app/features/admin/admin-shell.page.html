<ion-header class="mobile-header">
  <ion-toolbar>
    <ion-title>GAM · Administración</ion-title>
    <ion-button slot="end" fill="clear" aria-label="Cerrar sesión" (click)="logout()">Salir</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="admin-layout">
    <app-admin-sidebar
      [groups]="groups()"
      [firstVisibleRoute]="firstVisibleRoute()"
      [isShared]="auth.isShared()"
      [userName]="auth.user()?.name ?? ''"
      [roles]="auth.user()?.roles ?? []"
      (logoutRequested)="logout()" />
    <main class="workspace">
      <header class="topbar">
        <div><small>GAM · Gestión avícola</small><strong>Panel administrativo</strong></div>
        <div class="user-badge"><span>{{ auth.user()?.name?.slice(0, 1) ?? 'G' }}</span>{{ auth.user()?.name }}</div>
      </header>
      <section class="page-content"><router-outlet /></section>
    </main>
  </div>
</ion-content>
