<app-admin-sidebar #sidebar
  [groups]="groups()"
  [firstVisibleRoute]="firstVisibleRoute()"
  [isAdmin]="auth.isAdmin()"
  (logoutRequested)="logout()" />

<ion-header class="mobile-header">
  <ion-toolbar>
    <div class="mobile-toolbar">
      <ion-button fill="clear" class="menu-toggle" aria-label="Abrir navegación" aria-controls="admin-navigation"
        [attr.aria-expanded]="sidebar.mobileMenuOpen()" (click)="sidebar.toggleMobileMenu()">
        <ion-icon slot="icon-only" name="menu-outline" aria-hidden="true" />
      </ion-button>
      <span class="mobile-title">GAM · Administración</span>
      <div class="mobile-actions">
        <ion-button fill="clear" class="theme-toggle" [attr.aria-label]="theme.toggleLabel()" (click)="theme.toggle()">
          <ion-icon slot="icon-only" [name]="theme.toggleIcon()" aria-hidden="true" />
        </ion-button>
        <ion-button fill="clear" class="profile-link" routerLink="/mi-perfil">Mi perfil</ion-button>
        <ion-button fill="clear" class="mobile-logout" aria-label="Cerrar sesión" (click)="logout()">Salir</ion-button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="admin-layout">
    <main class="workspace">
      <header class="topbar">
        <div><small>GAM · Gestión avícola</small><strong>Panel administrativo</strong></div>
        <div class="topbar-actions">
          @if (hasDeliveryRole(auth.user())) {
            <ion-button fill="outline" routerLink="/repartidor">Modo repartidor</ion-button>
          }
          <ion-button fill="clear" class="theme-toggle" [attr.aria-label]="theme.toggleLabel()" (click)="theme.toggle()">
            <ion-icon slot="icon-only" [name]="theme.toggleIcon()" aria-hidden="true" />
          </ion-button>
          <ion-button fill="outline" class="profile-link" routerLink="/mi-perfil"
            [attr.aria-label]="'Mi perfil de ' + auth.user()?.name">{{ auth.user()?.name }}</ion-button>
        </div>
      </header>
      <section class="page-content"><router-outlet /></section>
    </main>
  </div>
</ion-content>
