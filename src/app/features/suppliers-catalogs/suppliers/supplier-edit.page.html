<section class="supplier-page" aria-labelledby="page-title">
  <header><h1 id="page-title">Editar proveedor</h1><p>Actualizá los datos del proveedor. La localidad es opcional.</p></header>
  @if (supplier(); as selected) {
    <app-supplier-form [supplier]="selected" (saved)="saved()" (cancelled)="cancel()" />
  } @else {
    <p role="alert">No se encontraron los datos del proveedor. Volvé al listado y elegí Editar nuevamente.</p>
    <a routerLink="/administracion/proveedores/proveedores">Volver al listado</a>
  }
</section>
